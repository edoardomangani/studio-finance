name: Render warm-up

# Sveglia il servizio Render (piano free, spin-down notturno) prima che parta
# il cron principale delle 07:00 ora di Roma. cron-job.org molla a 30s e il
# cold start ne richiede ~34: qui il curl aspetta fino a 90s, così il boot
# arriva in fondo. Da lì il job */5 7-21 tiene il servizio caldo tutto il giorno.

on:
  schedule:
    # Cron in UTC. 04:30 e 04:45 UTC = 06:30/06:45 ora di Roma (estate, UTC+2),
    # comunque prima delle 07:00 Roma anche d'inverno. Doppio colpo per coprire
    # i ritardi tipici dello scheduler di GitHub Actions.
    - cron: "30,45 4 * * *"
  workflow_dispatch: {}

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /up attendendo il cold start
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
              https://studio-finance.onrender.com/up) || code="000"
            echo "Tentativo $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Servizio non sveglio dopo i tentativi"
          exit 1
