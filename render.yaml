services:
  - type: web
    name: studio-finance
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    # Nota: preDeployCommand richiede il piano Starter+. Sul Free le migration e
    # il caching girano all'avvio del container via AUTORUN_* (vedi sotto).
    envVars:
      - key: AUTORUN_ENABLED   # serversideup: esegue migrate --force + config/route/view cache al boot
        value: "true"
      - key: APP_KEY          # genera in locale: php artisan key:generate --show
        sync: false
      - key: APP_URL          # es. https://studio-finance.onrender.com
        sync: false
      - key: DB_URL           # connection string POOLED di Neon (con -pooler e ?sslmode=require)
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: PORT
        value: "8080"
      - key: NGINX_FASTCGI_BUFFER_SIZE   # default 8k -> 502 su header grossi
        value: 32k
      - key: NGINX_FASTCGI_BUFFERS
        value: 16 16k
